name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude') &&
       github.actor != 'claude[bot]') ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude') &&
       github.actor != 'claude[bot]')
    env:
      HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip if no API key configured
        if: env.HAS_API_KEY != 'true'
        run: |
          echo "::warning::ANTHROPIC_API_KEY secret is not set — Claude review skipped."
          echo "Add it at: Settings → Secrets and variables → Actions → New repository secret"
          exit 0

      - uses: actions/checkout@v4
        if: env.HAS_API_KEY == 'true'

      - name: Read review instructions
        id: review
        if: env.HAS_API_KEY == 'true'
        run: |
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "instructions<<$EOF" >> "$GITHUB_OUTPUT"
          cat REVIEW.md >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_API_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ steps.review.outputs.instructions }}
